<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>715 Dynasty HQ</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">715</div>
        <div>
          <div class="brand-title">Dynasty HQ</div>
          <div class="brand-sub">League Command Center</div>
        </div>
      </div>

      <nav id="nav">
        <button class="nav-item active" data-view="home">Overview</button>
        <button class="nav-item" data-view="team">My Team</button>
        <button class="nav-item" data-view="waivers">Waivers</button>
        <button class="nav-item" data-view="league">League</button>
        <button class="nav-item" data-view="activity">Activity</button>
      </nav>

      <div class="sidebar-footer">
        <div class="sync-dot"></div>
        <div>
          <div class="small-label">Data source</div>
          <div>Sleeper via GitHub</div>
        </div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1 id="page-title">Overview</h1>
          <p id="page-subtitle">Live 715 Dynasty league state</p>
        </div>
        <div id="updated-at" class="updated">Loading…</div>
      </header>

      <section id="app" class="content">
        <div class="loading-card">Loading league data…</div>
      </section>
    </main>
  </div>

  <template id="stat-card-template">
    <article class="stat-card">
      <div class="stat-label"></div>
      <div class="stat-value"></div>
      <div class="stat-note"></div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
