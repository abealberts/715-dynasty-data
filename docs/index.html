<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0d0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="715 HQ" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>715 Dynasty HQ</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="noise-layer" aria-hidden="true"></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">715</div>
        <div>
          <div class="brand-title">Dynasty HQ</div>
          <div class="brand-sub">League Command Center</div>
        </div>
      </div>

      <div class="season-stamp">
        <span>SEASON 02</span>
        <strong>2026</strong>
      </div>

      <label class="mobile-nav-control">
        <span>Go to</span>
        <select id="mobile-nav" aria-label="Choose Dynasty HQ section">
          <optgroup label="Command">
            <option value="home">Overview</option><option value="team">My Team</option>
            <option value="roster-intelligence">Roster Intelligence</option><option value="trades">Trade Fit</option>
            <option value="opportunities">Opportunities</option><option value="waivers">Free Agent Index</option>
          </optgroup>
          <optgroup label="League Lab">
            <option value="power">Power Rankings</option><option value="recap">Weekly Recap</option>
            <option value="standings">Standings+</option><option value="lineups">Lineup Lab</option>
            <option value="playoffs">Playoff Simulator</option><option value="profiles">Team Profiles</option>
            <option value="managers">Manager Tendencies</option><option value="draft">Draft Capital</option>
            <option value="records">Records</option>
          </optgroup>
          <optgroup label="Data">
            <option value="intel">Player Intel</option><option value="league">League</option><option value="activity">Activity</option>
          </optgroup>
        </select>
      </label>

      <nav id="nav">
        <div class="nav-section">
          <div class="nav-label">Command</div>
          <button class="nav-item active" data-view="home">Overview</button>
          <button class="nav-item" data-view="team">My Team</button>
          <button class="nav-item" data-view="roster-intelligence">Roster Intelligence</button>
          <button class="nav-item" data-view="trades">Trade Fit</button>
          <button class="nav-item" data-view="opportunities">Opportunities</button>
          <button class="nav-item" data-view="waivers">Free Agent Index</button>
        </div>

        <div class="nav-section">
          <div class="nav-label">League Lab</div>
          <button class="nav-item" data-view="power">Power Rankings</button>
          <button class="nav-item" data-view="recap">Weekly Recap</button>
          <button class="nav-item" data-view="standings">Standings+</button>
          <button class="nav-item" data-view="lineups">Lineup Lab</button>
          <button class="nav-item" data-view="playoffs">Playoff Simulator</button>
          <button class="nav-item" data-view="profiles">Team Profiles</button>
          <button class="nav-item" data-view="managers">Manager Tendencies</button>
          <button class="nav-item" data-view="draft">Draft Capital</button>
          <button class="nav-item" data-view="records">Records</button>
        </div>

        <div class="nav-section">
          <div class="nav-label">Data</div>
          <button class="nav-item" data-view="intel">Player Intel</button>
          <button class="nav-item" data-view="league">League</button>
          <button class="nav-item" data-view="activity">Activity</button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sync-dot"></div>
        <div>
          <div class="small-label">Data source</div>
          <div>Sleeper via GitHub</div>
          <div class="small-label">Trending data: Sleeper</div>
        </div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div class="title-lockup">
          <div class="eyebrow">715 DYNASTY / LIVE DESK</div>
          <h1 id="page-title">Overview</h1>
          <p id="page-subtitle">Live 715 Dynasty league state</p>
        </div>
        <div class="topbar-right">
          <div id="data-status" class="status-pill"><span></span> SYNCED DATA</div>
          <div id="updated-at" class="updated">Loading…</div>
        </div>
      </header>

      <section id="league-pulse" class="league-pulse" aria-live="polite"></section>

      <section id="app" class="content">
        <div class="loading-card">Loading league data…</div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
  <script src="./theme.js"></script>
</body>
</html>
