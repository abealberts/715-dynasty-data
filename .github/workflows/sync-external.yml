name: Sync External Player Intelligence

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_external.py"
      - "scripts/external_intel.py"
      - ".github/workflows/sync-external.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 10 * * *"

permissions:
  contents: write

concurrency:
  group: sleeper-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh market and NFL performance feeds
        run: python scripts/sync_external.py

      - name: Rebuild derived analytics
        run: python scripts/build_derived.py

      - name: Commit external feeds and analytics if needed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/external data/derived)" ]]; then
            echo "No external-data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external data/derived
          git commit -m "Update external player intelligence"
          git push
