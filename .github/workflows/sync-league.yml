name: Sync Sleeper League

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
      - ".github/workflows/sync-league.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sleeper-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull Sleeper league data
        run: python scripts/sync_league.py

      - name: Build derived analytics
        run: python scripts/build_derived.py

      - name: Commit changes if needed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/current data/derived)" ]]; then
            echo "No Sleeper changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current data/derived
          git commit -m "Update Sleeper league snapshot"
          git push
