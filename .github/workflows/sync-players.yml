name: Sync Sleeper Players

on:
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * *"

permissions:
  contents: write

concurrency:
  group: sleeper-player-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh active-player and free-agent indexes
        run: python scripts/sync_players.py

      - name: Commit changes if needed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/current)" ]]; then
            echo "No player-data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current
          git commit -m "Update Sleeper player index"
          git push
